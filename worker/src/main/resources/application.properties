spring.application.name=hesaplab-worker
spring.main.web-application-type=none
spring.config.import=file:../infra/rabbitmq/.env.local[.properties],file:../db/oracle/.env.local[.properties]
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5673
spring.rabbitmq.virtual-host=hesaplab
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.datasource.url=jdbc:oracle:thin:@//127.0.0.1:1522/FREEPDB1
spring.datasource.username=${APP_USER}
spring.datasource.password=${APP_USER_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# Framework bağlantı hatalarında da stack trace basılmaz.
logging.exception-conversion-word=%nopex
