spring.application.name=hesaplab
spring.config.import=file:../db/oracle/.env.local[.properties]
server.address=127.0.0.1
server.port=${HESAPLAB_PORT:8081}
spring.datasource.url=jdbc:oracle:thin:@//127.0.0.1:1522/FREEPDB1
spring.datasource.username=${APP_USER}
spring.datasource.password=${APP_USER_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.read-only=true
spring.sql.init.mode=never
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.cookie.name=HESAPLAB_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
